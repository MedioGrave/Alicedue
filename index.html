<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pianta AliceDue</title>
<meta name="theme-color" content="#f7eddd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,100,1&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: pianta a tutto schermo; comandi flottanti — pillola in alto, dock in basso, pannelli che salgono dal basso. Look anni '70: antracite, carta crema, arcobaleno. */
:root{
  --night:#262124; --paper:#f7eddd; --paper-2:#eedfc6; --ink:#231f20; --ink-soft:#5a5052;
  --orange:#f58a2c; --pink:#ec5f9c; --purple:#7c62d6; --blue:#4b7de0; --yellow:#f8c540; --green:#79b84a; --red:#d93a33;
  --rainbow:linear-gradient(90deg,var(--purple) 0 20%,var(--blue) 20% 40%,var(--pink) 40% 60%,var(--orange) 60% 80%,var(--yellow) 80% 100%);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html,body{height:100%;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,.chip,.cat,.card{touch-action:manipulation}
.sh-body,.cats,.eximg,.vpop{touch-action:pan-x pan-y}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.disp{font-family:var(--f-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;letter-spacing:-.01em}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none;background:var(--paper)}
.hide-dims .dm,.hide-dims #L-Quote{display:none}
.hide-rooms .rn{display:none}
.vpop{position:fixed;right:12px;bottom:calc(var(--bot) + 98px);z-index:7;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;width:min(280px,calc(100% - 24px))}
.vpop .tg:last-child{border-bottom:none}
.pill{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rb{width:36px;height:36px;display:grid;place-items:center;padding:0;flex:none}
.rb[disabled]{opacity:.45}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.topbar{position:fixed;left:10px;right:10px;top:calc(var(--top) + 8px);display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;height:36px;min-width:0;flex:0 1 auto;text-align:left}
.badge{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:conic-gradient(from 200deg,var(--purple),var(--blue),var(--pink),var(--orange),var(--yellow),var(--purple));flex:none;display:grid;place-items:center}
.badge i{width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transition:background .2s}
.badge i.s-ok{background:var(--green)}.badge i.s-wait{background:var(--yellow)}.badge i.s-err{background:var(--red)}
.brand b{font-family:var(--f-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;font-size:15px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .car{width:16px;height:16px;flex:none}
.sp{flex:1}
.scale{position:fixed;left:10px;top:calc(var(--top) + 52px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:3px 8px 4px;font-size:11px;font-weight:600;z-index:4;pointer-events:none}
.scale .bar{height:6px;border:2px solid var(--ink);border-top:none;margin-top:2px}
.sync{position:fixed;right:14px;top:calc(var(--top) + 64px);font-size:11px;color:rgba(247,237,221,.7);z-index:4;pointer-events:none}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 12px);display:flex;align-items:flex-end;gap:2px;background:var(--ink);border:2px solid var(--paper);border-radius:30px;padding:6px 8px;z-index:5;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.db{width:64px;border:none;background:none;color:var(--paper);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.db .ic{width:36px;height:32px;border-radius:16px;display:grid;place-items:center}
.db.on .ic{background:var(--yellow);color:var(--ink)}
.db.tog.on .ic{background:var(--pink);color:var(--ink)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--orange);color:var(--ink);border:2px solid var(--paper);box-shadow:0 4px 0 var(--paper);display:grid;place-items:center;margin:-22px 4px 4px;flex:none}
.fab svg.i{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper)}
.ctx{position:fixed;left:10px;right:10px;bottom:calc(var(--bot) + 96px);display:flex;justify-content:center;z-index:5;pointer-events:none}
.ctx .in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:22px;padding:6px;box-shadow:0 3px 0 var(--ink);max-width:100%;min-width:0}
.ctx .lab{padding:0 6px;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.ctx .lab b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.ctx .lab em{font-style:normal;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.cb{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;height:40px;min-width:40px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.cb.acc{background:var(--yellow)}
.cb.hot{background:var(--pink)}
.cb.dang{color:var(--red)}
.cb:active{transform:translateY(1px)}
.cb.on{background:var(--ink);color:var(--paper)}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 52px);background:var(--ink);color:var(--paper);border:2px solid var(--paper);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;z-index:6;max-width:calc(100% - 150px);text-align:center;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hint.num{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;background:var(--pink);color:var(--ink);border-color:var(--ink)}
.focus .topbar,.focus .dock,.focus .ctx,.focus .scale,.focus .sync,.focus .welcome{display:none!important}
.unfocus{position:fixed;right:12px;bottom:calc(var(--bot) + 14px);z-index:6}
.scrim{position:fixed;inset:0;background:rgba(20,16,18,.28);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);color:var(--ink);border-top:2px solid var(--ink);border-radius:26px 26px 0 0;max-height:74vh;display:flex;flex-direction:column;padding-bottom:var(--bot);box-shadow:0 -6px 0 rgba(0,0,0,.25);overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
.sheet .stripe{height:8px;background:var(--rainbow);border-bottom:2px solid var(--ink);flex:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ink);opacity:.35;margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:4px 16px 8px;flex:none;touch-action:none}
.sh-head h2{margin:0;font-size:26px;line-height:1.05;flex:1;min-width:0;text-wrap:balance}
.sh-body{overflow:auto;padding:4px 16px 22px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
h3{margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
h3:first-child{margin-top:4px}
.srch{padding:0 16px 8px;flex:none;position:relative}
.srch input{width:100%;height:46px;border:2px solid var(--ink);border-radius:999px;padding:0 44px 0 44px;font-size:16px;font-weight:500;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);-webkit-appearance:none;appearance:none}
.srch input::placeholder{color:#8a7f80}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.srch .mg{position:absolute;left:30px;top:13px;color:var(--ink);pointer-events:none}
.srch .clr{position:absolute;right:24px;top:7px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper-2);color:var(--ink);display:grid;place-items:center;padding:0}
.grp{grid-column:1/-1;margin:10px 0 0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.grp:first-child{margin-top:0}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;flex:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.cat.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:2px solid var(--ink);background:#fbf5ea;color:var(--ink);border-radius:16px;padding:10px;text-align:left;box-shadow:0 3px 0 var(--ink);min-width:0}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card svg{width:100%;height:58px}
.card b{font-weight:600;font-size:14.5px;line-height:1.15}
.card em{font-style:normal;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stp{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.stp label{font-weight:500;font-size:14.5px}
.stp .ctl{display:flex;align-items:center;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.stp .ctl button{width:42px;height:42px;border:none;background:var(--paper-2);color:var(--ink);font-size:22px;font-weight:500;display:grid;place-items:center}
.stp .ctl input{width:74px;height:42px;border:none;border-left:2px solid var(--ink);border-right:2px solid var(--ink);text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);border-radius:0;-moz-appearance:textfield}
.stp .ctl input::-webkit-outer-spin-button,.stp .ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--yellow)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.name{width:100%;height:46px;border:2px solid var(--ink);border-radius:14px;padding:0 12px;font-size:17px;font-weight:600;background:#fff;color:var(--ink)}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink)}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.stats div{border:2px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fbf5ea}
.stats small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.stats b{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border:none;border-bottom:2px dashed rgba(35,31,32,.18);background:none;width:100%;text-align:left;color:var(--ink)}
.tg span{flex:1;min-width:0}
.tg span small{display:block;color:var(--ink-soft);font-size:13px}
.sw-t{width:52px;height:30px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-2);position:relative;flex:none}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw-t.on{background:var(--green)}
.sw-t.on::after{left:24px}
.li{display:grid;grid-template-columns:16px 1fr auto 36px;align-items:center;gap:10px;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#fbf5ea;color:var(--ink);margin-bottom:6px;text-align:left;width:100%;cursor:pointer}
.li .dt{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink)}
.li b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.li code{font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums}
.li .x{width:32px;height:32px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;color:var(--red)}
.li.on{background:var(--yellow)}
.empty{border:2px dashed rgba(35,31,32,.35);border-radius:14px;padding:12px;color:var(--ink-soft);line-height:1.45}
.note{color:var(--ink-soft);line-height:1.5;font-size:14px}
.note b{color:var(--ink)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper-2);border:2px solid var(--ink);border-radius:14px;padding:10px;margin-top:8px}
.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.acc{background:var(--yellow)}
.btn.dang{color:var(--red)}
.btn[disabled]{opacity:.4}
.exov{position:fixed;inset:0;z-index:11;background:rgba(20,16,18,.6);display:flex;align-items:center;justify-content:center;padding:calc(var(--top) + 16px) 16px calc(var(--bot) + 16px)}
.excard{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;padding:0 14px 14px}
.excard .stripe{height:8px;background:var(--rainbow);border-bottom:2px solid var(--ink);margin:0 -14px 10px}
.exhead{display:flex;align-items:center;gap:10px}.exhead h2{margin:0;font-size:24px;flex:1}
.eximg{flex:1;min-height:0;overflow:auto;margin:10px 0 4px;border:2px solid var(--ink);border-radius:14px;background:#fff}
.eximg img{display:block;width:100%;height:auto;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.excard .note{margin:4px 2px 10px;font-size:13px}
.tip{background:var(--yellow);border:2px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.35;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 52px);background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;z-index:12;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 24px);text-align:center;box-shadow:0 3px 0 var(--ink)}
.toast.on{opacity:1}
.welcome{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 104px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:10px 16px;z-index:4;box-shadow:0 3px 0 var(--ink);font-weight:500;text-align:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.welcome b{font-family:var(--f-display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;font-size:19px;display:block}
.ish{vector-effect:non-scaling-stroke;stroke-width:1.7}
.isl{vector-effect:non-scaling-stroke;stroke-width:1}
.ns{vector-effect:non-scaling-stroke}
.it.clash .ish{stroke:#d93a33;stroke-width:3}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.toast,.sw-t::after{transition:none}}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);animation:none}}
</style>

<svg id="cv" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="hide-dims">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f58a2c" fill-opacity=".08"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e8741a" stroke-opacity=".55" stroke-width="1.4"/></pattern>
  </defs>
  
  <g id="grid"></g><g id="plan"></g><g id="dyn"></g><g id="ov"></g>
</svg>

<header class="topbar">
  <button class="pill brand" id="lyBtn" aria-label="Ipotesi di arredo"><span class="badge"><i id="syncS"></i></span><b id="lyName">Ipotesi 1</b><svg class="i car" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <span class="sp"></span>
  <button class="pill rb" id="undo" aria-label="Annulla"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="pill rb" id="redo" aria-label="Ripristina"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="pill rb" id="menuBtn" aria-label="Menu: elenchi e impostazioni"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <button class="pill rb" id="focusBtn" aria-label="Solo pianta, a schermo pieno"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</header>
<div class="scale" id="scale"><span id="sbl">1 m</span><div class="bar" id="sbb"></div></div>
<div class="hint" id="hint" hidden></div>
<div class="welcome" id="welcome" hidden><b>La tua pianta, in scala vera</b>Tocca il <strong>+</strong> per aggiungere un arredo</div>
<div class="ctx" id="ctx" hidden><div class="in" id="ctxIn"></div></div>

<nav class="dock" aria-label="Strumenti">
  <button class="db" id="measBtn"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></span>Misura</button>
  <button class="db" id="viewBtn"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>Vista</button>
  <button class="fab" id="addBtn" aria-label="Aggiungi arredo"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="db" id="exportBtn"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg></span>Esporta</button>
</nav>
<div class="vpop" id="vpop" hidden></div>
<button class="pill rb unfocus" id="unfocus" hidden aria-label="Mostra i comandi"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle">

/* ---------- Geometria ---------- */
const isL=t=>t==='sofaL'||t==='deskL';

function rectP(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function ellP(rx,ry,n){const p=[];for(let i=0;i<n;i++){const a=(i+.5)/n*Math.PI*2;p.push([rx*Math.cos(a),ry*Math.sin(a)])}return p}
function localParts(it){
  const w=it.w,h=depthOf(it);
  if(it.t==='round'||it.t==='circle')return[ellP(w/2,h/2,24)];
  if(isL(it.t)){const d=Math.min(it.d,h),cw=Math.min(it.cw,w);return[rectP(-w/2,-h/2,w,d),rectP(w/2-cw,-h/2+d,cw,h-d)]}
  return[rectP(-w/2,-h/2,w,h)];
}
function xf(it){const a=(it.r||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),fx=it.flip?-1:1;return p=>[it.x+c*p[0]*fx-s*p[1],it.y+s*p[0]*fx+c*p[1]]}
function inv(it){const a=(it.r||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),fx=it.flip?-1:1;return p=>{const dx=p[0]-it.x,dy=p[1]-it.y;return[(c*dx+s*dy)*fx,-s*dx+c*dy]}}
function worldParts(it){const f=xf(it);return localParts(it).map(pl=>pl.map(f))}
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}
function polyPerim(p){let s=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];s+=Math.hypot(r[0]-q[0],r[1]-q[1])}return s}
function centroid(p){let a=0,cx=0,cy=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length],c=q[0]*r[1]-r[0]*q[1];a+=c;cx+=(q[0]+r[0])*c;cy+=(q[1]+r[1])*c}if(Math.abs(a)<1e-6){return p.reduce((s,q)=>[s[0]+q[0]/p.length,s[1]+q[1]/p.length],[0,0])}return[cx/(3*a),cy/(3*a)]}
function inConvex(pt,poly){let sg=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const c=(b[0]-a[0])*(pt[1]-a[1])-(b[1]-a[1])*(pt[0]-a[0]);if(Math.abs(c)<1e-9)continue;const s=Math.sign(c);if(!sg)sg=s;else if(s!==sg)return false}return true}
function satOverlap(A,B){for(const P of[A,B])for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],nx=a[1]-b[1],ny=b[0]-a[0];let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;for(const q of A){const v=q[0]*nx+q[1]*ny;a0=Math.min(a0,v);a1=Math.max(a1,v)}for(const q of B){const v=q[0]*nx+q[1]*ny;b0=Math.min(b0,v);b1=Math.max(b1,v)}const L=Math.hypot(nx,ny)||1;if(a1-b0<0.5*L||b1-a0<0.5*L)return false}return true}
function raySeg(o,d,a,b){const ex=b[0]-a[0],ey=b[1]-a[1],den=d[0]*ey-d[1]*ex;if(Math.abs(den)<1e-12)return Infinity;const t=((a[0]-o[0])*ey-(a[1]-o[1])*ex)/den,u=((a[0]-o[0])*d[1]-(a[1]-o[1])*d[0])/den;return(t>1e-6&&u>=-1e-9&&u<=1+1e-9)?t:Infinity}
function obstacles(excl){const ob=[];if(layers.items===false)return ob;for(const it of cur().items){if(it.id===excl||it.t==='rug'||it.t==='wallcab')continue;for(const pl of worldParts(it))for(let i=0;i<pl.length;i++)ob.push([pl[i],pl[(i+1)%pl.length]])}return ob}
function castRay(o,d,ob){let best=Infinity;for(const s of SEGS){const t=raySeg(o,d,[s[0],s[1]],[s[2],s[3]]);if(t<best)best=t}for(const s of ob){const t=raySeg(o,d,s[0],s[1]);if(t<best)best=t}return best}
function clearances(it){
  const parts=worldParts(it),a=(it.r||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const dirs=[[s,-c],[c,s],[-s,c],[-c,-s]];
  const ob=it.t==='rug'?[]:obstacles(it.id), res=[];
  for(const D of dirs){let best={t:Infinity};
    for(const pl of parts){const cc=centroid(pl);
      for(let i=0;i<pl.length;i++){const p=pl[i],q=pl[(i+1)%pl.length];let nx=q[1]-p[1],ny=p[0]-q[0];const L=Math.hypot(nx,ny);if(L<1e-6)continue;nx/=L;ny/=L;const m=[(p[0]+q[0])/2,(p[1]+q[1])/2];if((m[0]-cc[0])*nx+(m[1]-cc[1])*ny<0){nx=-nx;ny=-ny}
        if(nx*D[0]+ny*D[1]<0.995)continue;
        const ts=L>6?[0.03,0.5,0.97]:[0.5];
        for(const u of ts){const st=[p[0]+(q[0]-p[0])*u+D[0]*0.05,p[1]+(q[1]-p[1])*u+D[1]*0.05];if(parts.some(o=>o!==pl&&inConvex(st,o)))continue;const t=castRay(st,D,ob);if(t<best.t)best={t:t+0.05,o:[st[0]-D[0]*.05,st[1]-D[1]*.05],D}}}}
    res.push(best)}
  return res;
}

        o+=r.t*k>34?tag(fmt(r.t),(r.o[0]+e[0])/2,(r.o[1]+e[1])/2,ang,fs,'#fbc48f'):tag(fmt(r.t),e[0]+r.D[0]*18/k,e[1]+r.D[1]*18/k,0,fs,'#fbc48f')}
      if(!it.locked){const hr=11/k,rt=f([0,-h/2-34/k]),top=f([0,-h/2]),ew=f([it.w/2,0]),ed=f([0,h/2]);
        o+=`<line x1="${top[0]}" y1="${top[1]}" x2="${rt[0]}" y2="${rt[1]}" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/>`;
        o+=`<circle cx="${rt[0]}" cy="${rt[1]}" r="${hr}" fill="#f8c540" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/><g pointer-events="none" transform="translate(${rt[0]} ${rt[1]}) scale(${hr/10})"><path d="M5 0a5 5 0 1 1-1.5-3.5M4-7v4h-4" fill="none" stroke="${INK}" stroke-width="1.8" class="ns"/></g><circle data-h="rot" cx="${rt[0]}" cy="${rt[1]}" r="${24/k}" fill="transparent"/>`;
        for(const [p,hh] of[[ew,'rw'],[ed,'rd']])o+=`<rect x="${p[0]-hr*.85}" y="${p[1]-hr*.85}" width="${hr*1.7}" height="${hr*1.7}" rx="${hr*.4}" transform="rotate(${it.r||0} ${p[0]} ${p[1]})" fill="#ec5f9c" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/><circle data-h="${hh}" cx="${p[0]}" cy="${p[1]}" r="${22/k}" fill="transparent"/>`;}}}
  if(sel&&sel.kind==='measure'){const m=cur().measures.find(x=>x.id===sel.id);if(m)for(const [p,h] of[[m.a,'ma'],[m.b,'mb']])o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${9/k}" fill="#f8c540" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/><circle data-h="${h}" cx="${p[0]}" cy="${p[1]}" r="${24/k}" fill="transparent"/>`}
  if(sel&&sel.kind==='area'){const a=cur().areas.find(x=>x.id===sel.id);if(a)a.pts.forEach((p,i)=>{o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${8/k}" fill="#c9bcf3" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/><circle data-h="ap${i}" cx="${p[0]}" cy="${p[1]}" r="${22/k}" fill="transparent"/>`})}
  if(mLine&&preview)o+=measureSvg({id:'_p',a:mLine,b:preview},k,'_p');
  if(mLine&&!preview)o+=`<circle cx="${mLine[0]}" cy="${mLine[1]}" r="${7/k}" fill="#ec5f9c" stroke="${INK}" stroke-width="2" class="ns"/>`;
  if(mArea){const pts=preview?[...mArea,preview]:mArea;o+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="#7c62d6" fill-opacity=".12" stroke="${PURPLE}" stroke-width="2.4" stroke-linejoin="round" class="ns" pointer-events="none"/>`;mArea.forEach((p,i)=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${(i?5:9)/k}" fill="${i?PURPLE:'#c9bcf3'}" stroke="${INK}" stroke-width="2" class="ns" pointer-events="none"/>`)}
  if(snapMark){const p=snapMark.p,r=7/k;o+=snapMark.kind==='end'?`<rect x="${p[0]-r}" y="${p[1]-r}" width="${2*r}" height="${2*r}" rx="${r*.3}" fill="none" stroke="${ORANGE}" stroke-width="2.4" class="ns" pointer-events="none"/>`:`<path d="M${p[0]-r} ${p[1]-r}L${p[0]+r} ${p[1]+r}M${p[0]+r} ${p[1]-r}L${p[0]-r} ${p[1]+r}" stroke="${ORANGE}" stroke-width="2.4" class="ns" pointer-events="none"/>`}
  gOv.innerHTML=o;
  updateHint();
}

/* ---------- Suggerimenti e barra contestuale ---------- */
function updateHint(){
  const h=$('#hint');let t='',num=false;
  if(tool==='measure'){if(mLine&&preview){const dx=preview[0]-mLine[0],dy=preview[1]-mLine[1];t=`${fmt(Math.hypot(dx,dy))} cm`;num=true}else t=mLine?'Tocca il secondo punto':(cam.k<1.2?'Ingrandisci con due dita per più precisione':'Tocca due punti o trascina')}
  else if(tool==='area'){const pts=mArea?(preview?[...mArea,preview]:mArea):[];if(pts.length>=3){t=`${fmt(Math.abs(polyArea(pts))/1e4,2)} m²`;num=true}else t=pts.length?'Aggiungi gli angoli':'Tocca gli angoli della zona'}
  h.hidden=!t||!!sheetKind;h.textContent=t;h.classList.toggle('num',num);
}
function renderCtx(){
  const c=$('#ctx'),inn=$('#ctxIn');let o='';
  if(tool==='measure'){o=`<button class="cb hot" data-c="toArea" aria-label="Passa a superficie">m²</button><button class="cb${ortho?' on':''}" data-c="ortho">${IC.ortho} Dritta</button>${mLine?`<button class="cb" data-c="mcancel">Ricomincia</button>`:''}<button class="cb acc" data-c="done">Fine</button>`}
  else if(tool==='area'){o=`<button class="cb hot" data-c="toMeasure" aria-label="Passa a distanza">cm</button><button class="cb${ortho?' on':''}" data-c="ortho" aria-label="Solo linee dritte">${IC.ortho}</button>${mArea&&mArea.length?`<button class="cb" data-c="aundo">Togli punto</button>`:''}${mArea&&mArea.length>=3?`<button class="cb hot" data-c="aclose">Chiudi</button>`:''}<button class="cb acc" data-c="done">Fine</button>`}
  else{const x=findSel();
    if(x&&sel.kind==='item')o=`<div class="lab"><b>${esc(x.name)}</b><em>${dimsTxt(x)} cm</em></div><button class="cb" data-c="rot" aria-label="Ruota 90°">${IC.rot}</button><button class="cb acc" data-c="props">Misure</button><button class="cb" data-c="dup" aria-label="Duplica">${IC.dup}</button><button class="cb dang" data-c="del" aria-label="Elimina">${IC.del}</button>`;
    else if(x&&sel.kind==='measure')o=`<div class="lab"><b>${fmt(Math.hypot(x.b[0]-x.a[0],x.b[1]-x.a[1]))} cm</b><em>trascinala · ↔ ${fmt(Math.abs(x.b[0]-x.a[0]))} ↕ ${fmt(Math.abs(x.b[1]-x.a[1]))}</em></div><button class="cb dang" data-c="del" aria-label="Elimina">${IC.del}</button><button class="cb" data-c="desel" aria-label="Chiudi">${IC.x}</button>`;
    else if(x&&sel.kind==='area')o=`<div class="lab"><b>${fmt(Math.abs(polyArea(x.pts))/1e4,2)} m²</b><em>perimetro ${fmt(polyPerim(x.pts)/100,2)} m</em></div><button class="cb acc" data-c="props">Nome</button><button class="cb dang" data-c="del" aria-label="Elimina">${IC.del}</button><button class="cb" data-c="desel" aria-label="Chiudi">${IC.x}</button>`;
  }
  inn.innerHTML=o;c.hidden=!o||!!sheetKind;
  const L=cur();if(L&&layers.items===false&&L.items.length&&!o&&!sheetKind){$('#welcome').innerHTML='<b>Arredi nascosti</b>Riaccendili da <strong>Vista</strong>';$('#welcome').hidden=false;return}$('#welcome').innerHTML='<b>La tua pianta, in scala vera</b>Tocca il <strong>+</strong> per aggiungere un arredo';$('#welcome').hidden=!L||!!(L.items.length||L.measures.length||L.areas.length)||!!o||!!sheetKind||tool!=='select';
}
$('#ctxIn').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c,x=findSel();
  if(c==='ortho'){ortho=!ortho;renderCtx();return}
  if(c==='toArea'){setTool('area');return}
  if(c==='toMeasure'){setTool('measure');return}
  if(c==='mcancel'){mLine=null;preview=null;render();renderCtx();return}
  if(c==='aundo'){mArea.pop();if(!mArea.length)mArea=null;preview=null;render();renderCtx();return}
  if(c==='aclose')return finishArea();
  if(c==='done')return setTool('select');
  if(c==='rot'&&x){pushHist();x.r=((x.r||0)+90)%360;changed();return}
  if(c==='props')return openSheet('props');
  if(c==='dup')return dupSel();
  if(c==='del')return delSel();
  if(c==='desel'){sel=null;render();renderCtx()}
});

/* ---------- Storia / salvataggio ---------- */
const H=()=>hist[curId]||(hist[curId]={u:[],r:[]});
function snapState(){const L=cur();return JSON.stringify({items:L.items,measures:L.measures,areas:L.areas})}
function pushHist(){const h=H();h.u.push(snapState());if(h.u.length>150)h.u.shift();h.r=[];updUndo()}
function restore(s){const o=JSON.parse(s),L=cur();L.items=o.items;L.measures=o.measures;L.areas=o.areas;if(sel&&!findSel())sel=null;changed()}
function undo(){const h=H();if(!h.u.length)return;h.r.push(snapState());restore(h.u.pop());updUndo()}
function redo(){const h=H();if(!h.r.length)return;h.u.push(snapState());restore(h.r.pop());updUndo()}
function updUndo(){const h=H();$('#undo').disabled=!h.u.length;$('#redo').disabled=!h.r.length}
function changed(){render();renderCtx();if(sheetKind&&sheetKind!=='cat')renderSheet();scheduleSave(curId)}
function scheduleSave(id){const L=layouts[id];if(!L)return;L.updatedAt=Date.now();clearTimeout(pending[id]);pending[id]=setTimeout(()=>persist(id),500);setSync('…')}
async function persist(id){
  delete pending[id];const L=layouts[id];if(!L)return;
  const body={name:L.name,order:L.order||0,items:L.items,measures:L.measures,areas:L.areas,updatedAt:L.updatedAt};
  if(db){if(saving[id]){saving[id]=2;return}saving[id]=1;
    try{await db.doc('layouts/'+id).set(clone(body));delete L._local;setSync('salvato ✓')}
    catch(e){setSync('non salvato');toast(e&&e.code==='quota_exceeded'?'Spazio esaurito: elimina qualche ipotesi':'Salvataggio non riuscito, riprovo alla prossima modifica')}
    const again=saving[id]===2;delete saving[id];if(again)persist(id);
  }else{LS.set('pianta.layouts',JSON.stringify(layouts));setSync('salvato')}
}
function setSync(t){const d=$('#syncS');d.className=/non|offline/.test(t)?'s-err':t==='…'?'s-wait':t?'s-ok':'';d.parentNode.title=t||''}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}

/* ---------- Ipotesi ---------- */
function newLayout(name,from){const id=uid('l');const maxO=Math.max(0,...Object.values(layouts).map(l=>l.order||0));layouts[id]={id,name,order:maxO+1,items:from?clone(from.items):[],measures:from?clone(from.measures):[],areas:from?clone(from.areas):[],updatedAt:Date.now(),_local:true};return id}
function ensureCurrent(){
  if(!Object.keys(layouts).length){curId=newLayout('Ipotesi 1')}
  if(!layouts[curId]){const rem=LS.get('pianta.cur');curId=layouts[rem]?rem:Object.values(layouts).sort((a,b)=>(a.order||0)-(b.order||0))[0].id}
  for(const L of Object.values(layouts)){L.items=L.items||[];L.measures=L.measures||[];L.areas=L.areas||[]}
  $('#lyName').textContent=cur().name||'Senza nome';
}
function switchLayout(id){curId=id;LS.set('pianta.cur',id);sel=null;mLine=mArea=preview=null;$('#lyName').textContent=cur().name||'Senza nome';updUndo();render();renderCtx();if(sheetKind)renderSheet()}

function openSheet(k){sheetKind=k;confirmKey=null;if(k==='cat'){catQ='';$('#catQ').value='';$('#catQx').hidden=true}$('#sheet').hidden=false;$('#scrim').hidden=false;renderSheet();$('#shBody').scrollTop=0;renderCtx();updateHint()}

function miniIcon(e,g){const it={...e,x:0,y:0,r:0,g};const h=depthOf(it);const vw=Math.max(it.w,h*1.9)*1.12,vh=vw/1.9;const sc=Math.min(1,(vh*.9)/h);return`<svg viewBox="${-vw/2} ${-vh/2} ${vw} ${vh}" aria-hidden="true"><g transform="scale(${sc})">${sym(it,GROUPS[g].f)}</g></svg>`}
function findEntry(it){for(const [g,list] of CAT)for(const e of list)if(e.t===it.t&&e.n===it.base)return e;return null}

  if(!magnet)return;const tol=Math.min(16/cam.k,15);const cl=clearances(it);
  for(const pair of[[0,2],[1,3]]){let bi=-1,bt=tol;for(const i of pair){const t=cl[i].t;if(t<bt){bt=t;bi=i}}if(bi>=0){const D=cl[bi].D;it.x+=D[0]*bt;it.y+=D[1]*bt;continue}
    const A=cl[pair[0]],B=cl[pair[1]];if(isFinite(A.t)&&isFinite(B.t)&&A.t<1500&&B.t<1500){const d=(A.t-B.t)/2;if(Math.abs(d)<Math.min(12/cam.k,10)){it.x+=A.D[0]*d;it.y+=A.D[1]*d}}}

function endPtr(e){
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size===0){pinch=null;applyCam()}act=null;return}
  if(!act)return;const a=act;act=null;const touch=e.pointerType!=='mouse';const w=toWorld(e);
  if(a.type==='pan'){if(a.selectOnTap&&!a.moved){sel=a.selectOnTap;render();renderCtx();return}if(a.desel&&!a.moved&&sel){sel=null;render();renderCtx()}return}
  if(a.type==='mdrag'){if(a.moved&&preview&&Math.hypot(preview[0]-mLine[0],preview[1]-mLine[1])>0.5)finishMeasure();else{preview=null;render();renderCtx()}return}
  if(a.type==='mclick'){if(!a.moved){const s=snap(w,{touch});preview=orthoFix(mLine,s.p)}if(preview&&Math.hypot(preview[0]-mLine[0],preview[1]-mLine[1])>0.5)finishMeasure();return}
  if(a.type==='aclick'){const s=snap(w,{touch});const p=orthoFix(mArea&&mArea[mArea.length-1],s.p);if(!mArea)mArea=[];
    if(mArea.length>=3&&Math.hypot(p[0]-mArea[0][0],p[1]-mArea[0][1])<(touch?22:11)/cam.k){finishArea();return}
    mArea.push(p);preview=null;snapMark=s.kind?s:null;render();renderCtx();return}
  if(a.type==='drag'||a.type==='handle'||a.type==='mmove'){snapMark=null;if(a.moved)changed();else render()}
}

let downloads=null;
async function saveFile(name,data){
  if(downloads){try{await downloads.save({filename:name,data})}catch(e){if(e&&e.code!=='declined')toast('Salvataggio non riuscito')}return}
  const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.json')?'application/json':'application/octet-stream'});
  try{const f=new File([blob],name,{type:blob.type||'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast('Salvataggio non riuscito')}
}
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'x.png',{type:'image/png'})]}))}catch(e){return false}};
let lastPng=null;
/* Carica un livello della pianta per l'esportazione. Le immagini sono grandi: su iPhone Safari
   a volte fallisce, quindi si riprova e si carica un'immagine alla volta (vedi exportPng). */
async function loadImgOnce(src,retry){
  const r=await fetch(src,{cache:retry?'reload':'default'});if(!r.ok)throw new Error('HTTP '+r.status);
  const blob=await r.blob();
  if(window.createImageBitmap){try{const bm=await createImageBitmap(blob);return{img:bm,close:()=>{try{bm.close()}catch(_){}}}}catch(e){}}
  const u=URL.createObjectURL(blob);
  try{const i=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('decode'));i.src=u});
    if(i.decode)await i.decode().catch(()=>{});return{img:i,close:()=>{i.src='';URL.revokeObjectURL(u)}}}
  catch(e){URL.revokeObjectURL(u);throw e}
}
async function loadImg(src){let err;for(let a=0;a<3;a++){try{return await loadImgOnce(src,a>0)}catch(e){err=e;await new Promise(r=>setTimeout(r,400*(a+1)))}}throw new Error('immagine '+src+' ('+(err&&err.message||'errore')+')')}
function num(el,a,d=0){const v=parseFloat(el.getAttribute(a));return isFinite(v)?v:d}
function applyTf(ctx,t){if(!t)return;const re=/(\w+)\(([^)]*)\)/g;let m;while((m=re.exec(t))){const a=m[2].trim().split(/[\s,]+/).map(Number);
  if(m[1]==='translate')ctx.translate(a[0],a[1]||0);
  else if(m[1]==='rotate'){if(a.length>=3){ctx.translate(a[1],a[2]);ctx.rotate(a[0]*Math.PI/180);ctx.translate(-a[1],-a[2])}else ctx.rotate(a[0]*Math.PI/180)}
  else if(m[1]==='scale')ctx.scale(a[0],a.length>1?a[1]:a[0])}}
function rrect(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r||0,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function pts(el){return(el.getAttribute('points')||'').trim().split(/\s+/).map(p=>p.split(',').map(Number))}
function drawEl(ctx,el){
  const tag=(el.localName||el.tagName||'').toLowerCase();if(tag==='style'||tag==='defs')return;
  if(tag==='g'||tag==='svg'){ctx.save();applyTf(ctx,el.getAttribute('transform'));for(const c of Array.from(el.childNodes)){if(c.nodeType===1){try{drawEl(ctx,c)}catch(e){console.error(e)}}}ctx.restore();return}
  const cls=el.getAttribute('class')||'';let clash=false;for(let q=el.parentNode;q&&q.getAttribute;q=q.parentNode){if((q.getAttribute('class')||'').includes('clash')){clash=true;break}}
  let fill=el.getAttribute('fill');let stroke=el.getAttribute('stroke');
  if(stroke==='transparent')stroke=null;if(fill==='transparent')fill='none';
  if(fill&&fill.startsWith('url('))fill='rgba(245,138,44,.16)';
  let sw=cls.includes('ish')?.75:cls.includes('isl')?.45:num(el,'stroke-width',1)*(cls.includes('ns')?.45:1);
  if(clash&&cls.includes('ish')){stroke='#d93a33';sw=1.3}
  const fo=num(el,'fill-opacity',1),so=num(el,'stroke-opacity',1);
  const dash=el.getAttribute('stroke-dasharray');
  ctx.save();applyTf(ctx,el.getAttribute('transform'));
  const paint=()=>{if(fill&&fill!=='none'){ctx.globalAlpha=fo;ctx.fillStyle=fill;ctx.fill()}else if(fill==null&&tag!=='line'&&tag!=='polyline'){ctx.globalAlpha=fo;ctx.fillStyle='#000';ctx.fill()}
    if(stroke&&stroke!=='none'){ctx.globalAlpha=so;ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.lineJoin=el.getAttribute('stroke-linejoin')||'miter';ctx.lineCap=el.getAttribute('stroke-linecap')||'butt';ctx.setLineDash(dash?dash.split(/[\s,]+/).map(Number):[]);ctx.stroke()}ctx.globalAlpha=1};
  if(tag==='rect'){rrect(ctx,num(el,'x'),num(el,'y'),num(el,'width'),num(el,'height'),num(el,'rx'));paint()}
  else if(tag==='ellipse'||tag==='circle'){const rx=tag==='circle'?num(el,'r'):num(el,'rx'),ry=tag==='circle'?rx:num(el,'ry');ctx.beginPath();ctx.ellipse(num(el,'cx'),num(el,'cy'),Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);paint()}
  else if(tag==='line'){ctx.beginPath();ctx.moveTo(num(el,'x1'),num(el,'y1'));ctx.lineTo(num(el,'x2'),num(el,'y2'));if(!stroke)stroke='#000';fill='none';paint()}
  else if(tag==='polygon'||tag==='polyline'){const P=pts(el);ctx.beginPath();P.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(tag==='polygon')ctx.closePath();paint()}
  else if(tag==='text'){const fs=num(el,'font-size',12);const fam=(el.getAttribute('font-family')||'Outfit, sans-serif');ctx.font=`${el.getAttribute('font-weight')||400} ${fs}px ${fam}`;
    const an=el.getAttribute('text-anchor');ctx.textAlign=an==='middle'?'center':an==='end'?'right':'left';ctx.textBaseline=el.getAttribute('dominant-baseline')==='central'?'middle':'alphabetic';
    const x=num(el,'x'),y=num(el,'y'),t=el.textContent;
    if(stroke&&stroke!=='none'){ctx.lineJoin='round';ctx.lineWidth=num(el,'stroke-width',0);ctx.strokeStyle=stroke;ctx.globalAlpha=so;ctx.strokeText(t,x,y)}
    ctx.globalAlpha=1;ctx.fillStyle=fill&&fill!=='none'?fill:'#000';ctx.fillText(t,x,y)}
  ctx.restore();
}
async function exportPng(){
  toast('Preparo l\'immagine…');
  try{
    const k=2.3,TOP=80,BOT=90,W=Math.round(1150*k),Hh=Math.round((1496+TOP+BOT)*k);
    const layersToDraw=['plan_base.png'];if(layers.mobili)layersToDraw.push('plan_mobili.png');if(layers.dims)layersToDraw.push('plan_dims.png');if(layers.rooms)layersToDraw.push('plan_rooms.png');
    const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
    x.fillStyle=PAPER;x.fillRect(0,0,W,Hh);
    x.save();x.scale(k,k);
    ['#7c62d6','#4b7de0','#ec5f9c','#f58a2c','#f8c540'].forEach((col,i)=>{x.fillStyle=col;x.fillRect(i*230,0,230,10)});
    x.fillStyle=INK;x.textBaseline='alphabetic';x.textAlign='left';x.font='800 30px Fraunces, Georgia, serif';x.fillText(cur().name||'Pianta',30,52);
    const d=new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
    x.textAlign='right';x.font='500 15px Outfit, Helvetica, Arial, sans-serif';x.fillStyle='#5a5052';x.fillText(`AliceDue · scala reale · misure in cm · ${d}`,1120,52);
    x.translate(0,TOP);
    if(layers.grid){x.lineWidth=.5;for(let v=0;v<=1150;v+=50){x.strokeStyle=v%100?'#ebdcc3':'#dcc39e';x.beginPath();x.moveTo(v,0);x.lineTo(v,1496);x.stroke()}for(let v=0;v<=1496;v+=50){x.strokeStyle=v%100?'#ebdcc3':'#dcc39e';x.beginPath();x.moveTo(0,v);x.lineTo(1150,v);x.stroke()}}
    const skipped=[];
    for(const src of layersToDraw){let L;try{L=await loadImg(src)}catch(e){if(src==='plan_base.png')throw e;skipped.push(src);continue}
      try{x.drawImage(L.img,0,0,1150,1496)}finally{L.close()}}
    const host=document.createElementNS('http://www.w3.org/2000/svg','g');host.innerHTML=dynSvg(1.1,null);
    let drawn=0,failed=0;const walk=(el)=>{for(const ch of Array.from(el.childNodes)){if(ch.nodeType!==1)continue;try{drawEl(x,ch);drawn++}catch(e){failed++;console.error(e)}}};walk(host);
    const L=cur();if((L.items.length||L.measures.length||L.areas.length)&&!drawn)throw new Error('arredi non disegnati');
    // barra di scala
    x.translate(30,1496+45);x.fillStyle=INK;x.fillRect(0,0,100,10);x.fillStyle='#fff';x.fillRect(100,0,100,10);x.strokeStyle=INK;x.lineWidth=2;x.setLineDash([]);x.strokeRect(0,0,200,10);
    x.fillStyle=INK;x.font='600 14px Outfit, Helvetica, Arial, sans-serif';x.textAlign='center';x.fillText('0',0,-8);x.fillText('1 m',100,-8);x.fillText('2 m',200,-8);
    x.restore();
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    c.width=c.height=0;
    if(!blob)throw new Error('immagine troppo grande per questo telefono');
    lastPng=blob;
    // data URL come prima: su iPhone permette «tieni premuto → Salva in Foto»
    const url=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>ko(new Error('lettura immagine'));fr.readAsDataURL(blob)});
    showExport(url);
    if(skipped.length)toast('Alcuni livelli non sono stati caricati: riprova se mancano');
  }catch(err){console.error(err);toast('Esportazione non riuscita: '+(err&&err.message?err.message:'errore'))}
}
function showExport(url){closeSheet();$('#exImg').src=url;$('#exov').hidden=false;const share=!downloads&&canShareFiles();$('#exSave').hidden=!lastPng;$('#exSave').textContent=downloads?'Salva in File':share?'Salva in Foto / Condividi':'Scarica immagine';$('#exSave').classList.toggle('acc',share);$('#exNote').textContent=downloads?'Il pulsante qui sotto salva invece un file PNG nell\'app File.':share?'Dal menu di condivisione scegli «Salva immagine» per metterla nelle Foto.':'Oppure usa il pulsante qui sotto per scaricarla.'}
$('#exClose').onclick=()=>{$('#exov').hidden=true;$('#exImg').removeAttribute('src')};
$('#exSave').onclick=()=>{if(lastPng)saveFile(`pianta-${slug(cur().name)}.png`,lastPng)};

/* ---------- Blocca lo zoom della pagina (Safari) ---------- */
(()=>{try{let m=document.querySelector('meta[name=viewport]');if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m)}m.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')}catch(_){}
  const stop=e=>{e.preventDefault()};
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,stop,{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  let lastEnd=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastEnd<320&&e.target.closest&&e.target.closest('#cv'))e.preventDefault();lastEnd=n},{passive:false});
})();

/* ---------- Avvio ---------- */
async function boot(){
  VW=innerWidth;VH=innerHeight;
  try{const r=await fetch('plan.json');PLAN=await r.json()}catch(e){toast('Impossibile caricare la pianta: ricarica la pagina');return}
  SEGS=PLAN.segs;const seen=new Set();for(const s of SEGS)for(const q of[[s[0],s[1]],[s[2],s[3]]]){const k=q[0]+','+q[1];if(!seen.has(k)){seen.add(k);ENDS.push(q)}}
  buildPlan();
  try{Object.assign(layouts,JSON.parse(LS.get('pianta.layouts')||'{}'))}catch(e){}
  ensureCurrent();updUndo();fit();renderCtx();
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(d=>{downloads=d}).catch(()=>{});
    const d=await window.claude.use('db').catch(()=>null);
    if(d){db=d;let first=true;
      db.collection('layouts').onSnapshot(snap=>{
        const inc={};snap.docs.forEach(doc=>{const v=doc.data();if(v)inc[doc.id]={...clone(v),id:doc.id}});
        if(snap.metadata&&snap.metadata.fromCache&&first&&!snap.size)return;
        if(first){for(const id in layouts)if(!inc[id]&&!pending[id]&&!(layouts[id].items.length||layouts[id].measures.length||layouts[id].areas.length))delete layouts[id];if(!layouts[curId])curId=null}
        for(const id in inc){if(pending[id]||saving[id]||(act&&id===curId))continue;const L=layouts[id];if(L&&JSON.stringify([L.name,L.items,L.measures,L.areas])===JSON.stringify([inc[id].name,inc[id].items,inc[id].measures,inc[id].areas]))continue;layouts[id]=inc[id]}
        for(const id in layouts)if(!inc[id]&&!layouts[id]._local&&!pending[id]&&!saving[id])delete layouts[id];
        dbLive=true;first=false;ensureCurrent();updUndo();
        if(sel&&!findSel())sel=null;render();renderCtx();
        if(sheetKind&&!(document.activeElement&&/INPUT/.test(document.activeElement.tagName)))renderSheet();setSync('online ✓');
      },err=>{setSync('offline');toast('Sincronizzazione interrotta: le modifiche restano qui')});
    }
  }
}
boot();
})();
